name: Release
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Gradle test task selector (e.g. ":spring-webmvc:test --tests FooTests"); empty runs the full build'
        required: false
        default: ''
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  build-and-stage-release:
    name: Build and Stage Release
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check Out Code
        uses: actions/checkout@v4
      - name: Build and Publish
        id: build-and-publish
        uses: ./.github/actions/build
        with:
          develocity-access-key: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
          publish: true
          test-filter: ${{ inputs.test-filter }}
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spring-webmvc-jar
          path: |
            deployment-repository/org/springframework/spring-webmvc/*/spring-webmvc-*.jar
            !deployment-repository/**/*-sources.jar
            !deployment-repository/**/*-javadoc.jar
          if-no-files-found: error
    outputs:
      version: ${{ steps.build-and-publish.outputs.version }}
