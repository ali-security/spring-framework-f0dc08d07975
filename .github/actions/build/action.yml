name: 'Build'
description: 'Builds the project, optionally publishing it to a local deployment repository'
inputs:
  develocity-access-key:
    description: 'Access key for authentication with ge.spring.io'
    required: false
  java-distribution:
    description: 'Java distribution to use'
    required: false
    default: 'liberica'
  java-early-access:
    description: 'Whether the Java version is in early access'
    required: false
    default: 'false'
  java-toolchain:
    description: 'Whether a Java toolchain should be used'
    required: false
    default: 'false'
  java-version:
    description: 'Java version to compile and test with'
    required: false
    default: '17'
  publish:
    description: 'Whether to publish artifacts ready for deployment to Artifactory'
    required: false
    default: 'false'
  test-filter:
    description: 'Gradle test task selector; when set, only these tests run (artifacts are still assembled)'
    required: false
    default: ''
outputs:
  build-scan-url:
    description: 'URL, if any, of the build scan produced by the build'
    value: ${{ (inputs.publish == 'true' && steps.publish.outputs.build-scan-url) || steps.build.outputs.build-scan-url }}
  version:
    description: 'Version that was built'
    value: ${{ steps.read-version.outputs.version }}
runs:
  using: composite
  steps:
    - name: Prepare Gradle Build
      uses: ./.github/actions/prepare-gradle-build
      with:
        develocity-access-key: ${{ inputs.develocity-access-key }}
        java-distribution: ${{ inputs.java-distribution }}
        java-early-access: ${{ inputs.java-early-access }}
        java-toolchain: ${{ inputs.java-toolchain }}
        java-version: ${{ inputs.java-version }}
    - name: Configure Test Result Reporting
      shell: bash
      run: |
        mkdir -p $HOME/.gradle/init.d
        cat > $HOME/.gradle/init.d/seal-test-results.gradle <<'EOF'
        allprojects {
          tasks.withType(Test).configureEach { t ->
            // Always execute tests: never serve Test results from the (remote) build cache
            t.outputs.cacheIf { false }
            t.outputs.upToDateWhen { false }
            def skippedFile = t.project.file("build/seal-skipped/${t.name}.tsv")
            t.doFirst { skippedFile.delete() }
            t.afterSuite { desc, result ->
              if (desc.parent == null) {
                println "TEST SUMMARY ${t.path}: tests=${result.testCount} passed=${result.successfulTestCount} failed=${result.failedTestCount} skipped=${result.skippedTestCount} result=${result.resultType}"
              }
            }
            t.afterTest { desc, result ->
              if (result.resultType.name() == 'SKIPPED') {
                skippedFile.parentFile.mkdirs()
                def msg = (result.exception?.message ?: '').replaceAll('\\s+', ' ')
                skippedFile << "${t.path}\t${desc.className}\t${desc.name}\t${msg}\t${desc.parent?.name ?: ''}\n"
              }
            }
          }
        }
        EOF
    - name: Build
      id: build
      if: ${{ inputs.publish == 'false' }}
      shell: bash
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          ./gradlew assemble ${{ inputs.test-filter }}
        else
          ./gradlew check antora
        fi
    - name: Publish
      id: publish
      if: ${{ inputs.publish == 'true' }}
      shell: bash
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          ./gradlew -PdeploymentRepository=$(pwd)/deployment-repository assemble publishAllPublicationsToDeploymentRepository ${{ inputs.test-filter }}
        else
          ./gradlew -PdeploymentRepository=$(pwd)/deployment-repository build publishAllPublicationsToDeploymentRepository
        fi
    - name: Report Skipped Tests With Reasons
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        python3 - <<'EOF'
        import glob, os, re
        rows = []
        for f in sorted(glob.glob('**/build/seal-skipped/*.tsv', recursive=True)):
            for line in open(f, encoding='utf-8', errors='replace'):
                parts = line.rstrip('\n').split('\t')
                if len(parts) >= 3:
                    rows.append((parts + ['', ''])[:5])
        print(f"SKIPPED TESTS REPORT: {len(rows)} skipped test(s)")
        if not rows:
            raise SystemExit(0)
        index = {}
        for src in glob.glob('**/src/*/java/**/*.java', recursive=True) + glob.glob('**/src/*/kotlin/**/*.kt', recursive=True):
            if '/build/' in src:
                continue
            m = re.search(r'/src/[^/]+/(?:java|kotlin)/(.+)\.(?:java|kt)$', src)
            if m:
                index.setdefault(m.group(1).replace('/', '.'), src)
        cache = {}
        def lines_of(path):
            if path not in cache:
                cache[path] = open(path, encoding='utf-8', errors='replace').read().split('\n')
            return cache[path]
        ANN = re.compile(r'@(Disabled\w*|Enabled\w*|Ignore|IfProfileValue|EnabledForTestGroups)\b(\([^)]*\)?)?')
        ASSUME = re.compile(r'\b(assume\w*\s*\(|Assumptions\.\w+|Assume\.\w+|abort\s*\()')
        def block_from(lines, i):
            out, depth, started = [], 0, False
            for j in range(i, min(len(lines), i + 400)):
                out.append(lines[j])
                depth += lines[j].count('{') - lines[j].count('}')
                if '{' in lines[j]:
                    started = True
                if started and depth <= 0:
                    break
            return out
        def annotations_above(lines, i):
            found = []
            for j in range(max(0, i - 8), i + 1):
                found += [m.group(0) for m in ANN.finditer(lines[j])]
            return found
        def assumptions(block):
            return [l.strip() for l in block if ASSUME.search(l)]
        def class_info(fqcn):
            outer = fqcn.split('$')[0]
            simple = fqcn.split('$')[-1].split('.')[-1]
            path = index.get(outer)
            if not path:
                return None, None, None
            lines = lines_of(path)
            for i, l in enumerate(lines):
                if re.search(r'\b(class|interface)\s+' + re.escape(simple) + r'\b', l):
                    return path, lines, i
            return path, lines, None
        def superclass(fqcn, lines, ci):
            if ci is None:
                return None
            m = re.search(r'\bextends\s+([A-Z]\w*)', ' '.join(lines[ci:ci + 3]))
            if not m:
                return None
            name = m.group(1)
            for l in lines:
                im = re.match(r'\s*import\s+([\w.]+)\.' + name + r'\s*;?\s*$', l)
                if im:
                    return im.group(1) + '.' + name
            pkg = fqcn.split('$')[0].rsplit('.', 1)[0]
            return pkg + '.' + name
        def resolve(cls, name, depth=0):
            reasons = []
            path, lines, ci = class_info(cls)
            if not lines:
                return reasons
            if ci is not None:
                reasons += ['class ' + a for a in annotations_above(lines, ci)]
                # assumptions in lifecycle methods
                for i, l in enumerate(lines):
                    if re.search(r'@(BeforeEach|BeforeAll|BeforeClass|Before)\b', l):
                        for k in range(i, min(len(lines), i + 4)):
                            if '(' in lines[k] and ('void' in lines[k] or 'fun' in lines[k]):
                                reasons += ['setup ' + a for a in assumptions(block_from(lines, k))]
                                break
            mm = re.match(r'(\w+)', name or '')
            method = mm.group(1) if mm else None
            if method:
                for i, l in enumerate(lines):
                    if re.search(r'\b(void|fun)\s+' + re.escape(method) + r'\s*\(', l):
                        reasons += annotations_above(lines, i)
                        reasons += assumptions(block_from(lines, i))
                        break
            if not reasons and depth < 5:
                sup = superclass(cls, lines, ci)
                if sup and sup != cls:
                    reasons += resolve(sup, name, depth + 1)
            return reasons
        unresolved = 0
        for task, cls, name, msg, parent in rows:
            if not re.match(r'\w+\(', name or '') and re.match(r'\w+\(', parent or ''):
                name_for_lookup = parent
            else:
                name_for_lookup = name
            if msg:
                reason = 'runtime: ' + msg
            else:
                found = resolve(cls, name_for_lookup)
                if not found:
                    _, cl, _ = class_info(cls)
                    found = ['class-wide ' + a for a in assumptions(cl or [])]
                if not found and name == cls:
                    found = resolve(cls, '')
                seen = []
                for r in found:
                    if r not in seen:
                        seen.append(r)
                reason = '; '.join(seen[:4]) if seen else ''
            if not reason:
                unresolved += 1
                reason = 'skipped by JUnit at runtime (no annotation/assumption found in source)'
            print(f"SKIPPED {task} {cls} > {name} -- reason: {reason}")
        print(f"SKIPPED TESTS REPORT END: {len(rows)} skipped, {unresolved} without a source-level reason")
        EOF
    - name: Read Version From gradle.properties
      id: read-version
      shell: bash
      run: |
        version=$(sed -n 's/version=\(.*\)/\1/p' gradle.properties)
        echo "Version is $version"
        echo "version=$version" >> $GITHUB_OUTPUT
